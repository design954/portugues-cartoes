<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Português">
<title>Português — Cartões</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --ink:#1a1c20; --muted:#6b7280;
    --line:#e6e8ec; --shadow:0 1px 2px rgba(20,22,28,.05),0 8px 24px rgba(20,22,28,.06);
    --m:#2563eb; --m-bg:#eaf1ff; --f:#db2777; --f-bg:#fdeaf4;
    --warn:#d97706; --warn-bg:#fff4e2; --accent:#0f766e;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f1114; --card:#171a1f; --ink:#e9ebef; --muted:#9aa1ad;
      --line:#262b33; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
      --m:#7ea8ff; --m-bg:#1a2740; --f:#f27bb5; --f-bg:#3a1c2c;
      --warn:#f0b25a; --warn-bg:#3a2c14; --accent:#5eead4;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;padding:24px 16px 64px}
  .wrap{max-width:1200px;margin:0 auto}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px;margin-bottom:20px}
  h1{font-size:22px;font-weight:650;margin:0;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-left:auto}
  .ctl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);user-select:none}
  .ctl input[type=range]{width:110px;accent-color:var(--accent)}
  .switch{cursor:pointer}
  .switch input{accent-color:var(--accent);width:16px;height:16px}
  select{font:inherit;font-size:13px;padding:4px 8px;border:1px solid var(--line);
    border-radius:8px;background:var(--card);color:var(--ink)}
  .search{flex:1 1 220px;min-width:180px;font:inherit;font-size:14px;padding:9px 14px;
    border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
  .search::placeholder{color:var(--muted)}
  .search:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  .empty{display:none;color:var(--muted);font-size:14px;padding:24px 4px}
  .card.hidden{display:none}
  .section{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
    color:var(--muted);margin:30px 2px 12px}
  .section:first-of-type{margin-top:6px}
  .g.v{color:var(--accent);background:transparent;border:1px solid var(--accent)}
  .prep{color:var(--muted);font-weight:450;font-size:15px}
  .card.phrase .word{font-size:16px;line-height:1.3;font-weight:600}
  .card.phrase .ipa{margin-top:6px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .card{position:relative;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:16px 16px 14px;box-shadow:var(--shadow);cursor:pointer;
    transition:transform .12s ease,box-shadow .12s ease;overflow:hidden}
  .card:hover{transform:translateY(-2px)}
  .card:active{transform:translateY(0) scale(.99)}
  .card.speaking{outline:2px solid var(--accent);outline-offset:-2px}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .word{font-size:21px;font-weight:640;letter-spacing:-.01em;line-height:1.15}
  .badges{display:flex;gap:6px;flex-shrink:0}
  .g{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;line-height:1}
  .g.m{color:var(--m);background:var(--m-bg)}
  .g.f{color:var(--f);background:var(--f-bg)}
  .ex{font-size:11px;font-weight:800;color:var(--warn);background:var(--warn-bg);
    padding:3px 7px;border-radius:999px;line-height:1}
  .ipa{font-size:14px;color:var(--accent);margin-top:8px;letter-spacing:.01em;text-transform:lowercase}
  .tr{margin-top:10px;font-size:14px;line-height:1.4}
  .ru{color:var(--ink)}
  .en{color:var(--muted);font-size:13px}
  .note{margin-top:8px;font-size:12px;color:var(--warn);line-height:1.35;
    border-top:1px dashed var(--line);padding-top:8px}
  body.hide-tr .tr,body.hide-tr .note{display:none}
  .spk{position:absolute;right:12px;bottom:12px;color:var(--muted);opacity:.5;font-size:14px}
  .warnbar{display:none;margin:0 0 16px;padding:10px 14px;border-radius:10px;
    background:var(--warn-bg);color:var(--warn);font-size:13px}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Português — Cartões</h1>
      <div class="sub">Tap a card to hear it · EP transcription · <b>!</b> = gender you must memorise</div>
    </div>
    <div class="controls">
      <input id="search" class="search" type="search" placeholder="Search — слово, перевод, транскрипция…" autocomplete="off">
      <label class="ctl">Voice <select id="voice"></select></label>
      <label class="ctl">Speed <input id="rate" type="range" min=".6" max="1.1" step=".05" value=".9"></label>
      <label class="ctl switch"><input id="toggle" type="checkbox" checked> Translations</label>
    </div>
  </header>
  <div class="warnbar" id="warnbar"></div>
  <h2 class="section" id="head-sub">Substantivos · существительные</h2>
  <div class="grid" id="grid"></div>
  <h2 class="section" id="head-verbs">Verbos · глаголы</h2>
  <div class="grid" id="grid-verbs"></div>
  <h2 class="section" id="head-frases">Frases · фразы</h2>
  <div class="grid" id="grid-frases"></div>
  <h2 class="section" id="head-pares">Pares · пары слов</h2>
  <div class="grid" id="grid-pares"></div>
  <h2 class="section" id="head-pedidos">Posso / podes · я могу / ты можешь</h2>
  <div class="grid" id="grid-pedidos"></div>
  <div class="empty" id="empty">Ничего не найдено.</div>
</div>

function buildCard(d, kind){
  const el = document.createElement('div');
  if(kind==='phrase'){
    el.className='card phrase';
    el.dataset.search=[d.pt,d.ipa,d.ru].join(' ').toLowerCase();
    el.innerHTML = `
      <div class="word">${d.pt}</div>
      <div class="ipa">${d.ipa}</div>
      <div class="tr"><div class="ru">${d.ru}</div></div>
      <span class="spk">🔊</span>`;
    el.addEventListener('click',()=>speak(d,el));
    return el;
  }
  el.className='card';
  el.dataset.search=[d.a||'',d.w,d.prep||'',d.ipa,d.ru,d.en,d.alt||''].join(' ').toLowerCase();
  const head = kind==='verb'
    ? `${d.w}${d.prep?' <span class="prep">('+d.prep+')</span>':''}`
    : `${d.a} ${d.w}`;
  const badges = kind==='verb'
    ? '<span class="g v">v</span>'
    : `${d.ex?'<span class="ex" title="Род нужно запомнить">!</span>':''}<span class="g ${d.g}">${d.g}</span>`;
  el.innerHTML = `
    <div class="top">
      <div class="word">${head}</div>
      <div class="badges">${badges}</div>
    </div>
    <div class="ipa">${d.ipa}</div>
    <div class="tr">
      <div class="ru">${d.ru}</div>
      <div class="en">${d.en}${d.alt?' · <i>'+d.alt+'</i>':''}</div>
    </div>
    <span class="spk">🔊</span>`;
  el.addEventListener('click',()=>speak(d,el));
  return el;
}

const grid = document.getElementById('grid');
WORDS.forEach(d=>grid.appendChild(buildCard(d,'noun')));

/* ---- Speech ---- */
const rateEl = document.getElementById('rate');
const voiceSel = document.getElementById('voice');
let voices = [];
let chosen = null;

function loadVoices(){
  const all = speechSynthesis.getVoices();
  if(!all.length) return; // not ready yet — onvoiceschanged will fire again
  voices = all.filter(v=>/^pt/i.test(v.lang));
  voiceSel.innerHTML='';
  const bar = document.getElementById('warnbar');
  if(!voices.length){
    bar.style.display='block';
    bar.textContent=
      'В браузере не найден португальский голос. В Safari/Chrome он обычно есть; на macOS добавьте голос в System Settings → Accessibility → Spoken Content → System Voice (Joana, pt-PT).';
    return;
  }
  bar.style.display='none';
  // prefer European Portuguese
  voices.sort((a,b)=> (/pt[-_]PT/i.test(b.lang)-/pt[-_]PT/i.test(a.lang)));
  voices.forEach((v,i)=>{
    const o=document.createElement('option');
    o.value=i; o.textContent=`${v.name} (${v.lang})`;
    voiceSel.appendChild(o);
  });
  chosen = voices[0];
}
voiceSel.addEventListener('change',()=>chosen=voices[voiceSel.value]);
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speak(d,el){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const text = d.say || d.pt || [d.a,d.w].filter(Boolean).join(' ');
  const u = new SpeechSynthesisUtterance(text);
  u.lang = chosen ? chosen.lang : 'pt-PT';
  if(chosen) u.voice = chosen;
  u.rate = parseFloat(rateEl.value);
  document.querySelectorAll('.card.speaking').forEach(c=>c.classList.remove('speaking'));
  el.classList.add('speaking');
  u.onend = ()=>el.classList.remove('speaking');
  u.onerror = ()=>el.classList.remove('speaking');
  speechSynthesis.speak(u);
}

/* ---- Search / filter ---- */
const search = document.getElementById('search');
const empty = document.getElementById('empty');
const sections = [['grid','head-sub'],['grid-verbs','head-verbs'],['grid-frases','head-frases'],['grid-pares','head-pares'],['grid-pedidos','head-pedidos']];
search.addEventListener('input',()=>{
  const q = search.value.trim().toLowerCase();
  let total = 0;
  sections.forEach(([gid,hid])=>{
    let shown = 0;
    document.getElementById(gid).querySelectorAll('.card').forEach(c=>{
      const hit = !q || c.dataset.search.includes(q);
      c.classList.toggle('hidden', !hit);
      if(hit) shown++;
    });
    document.getElementById(hid).style.display = shown ? '' : 'none';
    total += shown;
  });
  empty.style.display = total ? 'none' : 'block';
});
